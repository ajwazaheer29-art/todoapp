{% extends 'base.html' %}
{% block title %}Delete task — Daymark{% endblock %}
{% block content %}
<div class="confirm-wrap"><section class="confirm-card"><div class="confirm-icon">!</div><p class="eyebrow">ONE LAST CHECK</p><h1>Delete this task?</h1><p class="confirm-copy">Are you sure you want to delete <strong>“{{ object.title }}”</strong>?<br><span>This action cannot be undone.</span></p><form method="post" data-confirm-delete>{% csrf_token %}<div class="form-actions centered"><a class="button button-secondary" href="{% url 'task_detail' object.pk %}">Keep task</a><button class="button button-danger" type="submit">Delete task</button></div></form></section></div>
{% endblock %}
